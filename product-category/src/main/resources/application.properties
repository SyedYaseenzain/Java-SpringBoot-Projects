spring.application.name=product-category
server.port=8083

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/kodewala
spring.datasource.username=root
spring.datasource.password=Toufiq
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false


pring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

eureka.client.fetch-registry=true

management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
spring.cloud.openfeign.micrometer.enabled=true

logging.pattern.level=%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1